name: Test and release desktop installer

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    name: Test, build and publish Windows installer
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Run automated tests
        run: npm test

      - name: Increment desktop patch version
        id: desktop-version
        run: |
          $baseVersion = [version](node -p "require('./package.json').version")
          $publishedVersions = git tag --list "desktop-v*.*.*" |
            ForEach-Object { $_ -replace '^desktop-v', '' } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_ }

          if ($publishedVersions) {
            $latestVersion = $publishedVersions | Sort-Object -Descending | Select-Object -First 1
            $major = $latestVersion.Major
            $minor = $latestVersion.Minor
            $patch = $latestVersion.Build + 1
          } else {
            $major = $baseVersion.Major
            $minor = $baseVersion.Minor
            $patch = $baseVersion.Build + 1
          }

          $version = "$major.$minor.$patch"
          npm version $version --no-git-tag-version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run desktop:build
        env:
          PUBLISH_FOR_PULL_REQUEST: "false"

      - name: Publish installer on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.desktop-version.outputs.version }}
          name: Mural do Caos ao Commit v${{ steps.desktop-version.outputs.version }}
          target_commitish: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          body: |
            Instalador Windows do Mural do Caos ao Commit.

            ${{ github.event_name == 'pull_request' && format('Gerado automaticamente após a conclusão do PR #{0} em `main`, com os testes automatizados aprovados.', github.event.pull_request.number) || format('Gerado manualmente a partir de `{0}`, com os testes automatizados aprovados.', github.ref_name) }}
          files: web/release/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
